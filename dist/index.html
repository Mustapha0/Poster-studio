<script id="ps-editor-complete-runtime">
(() => {
  const TEXT_STYLE_ATTRS = ['font-size','font-weight','font-style','text-decoration','text-anchor','fill','font-family'];
  const keyForText = (el, index) => `${index}|${(el.textContent || '').replace(/\s+/g,' ').trim().slice(0,180)}`;
  const storageKey = svg => {
    const vb = svg.getAttribute('viewBox') || '';
    const texts = [...svg.querySelectorAll('text')];
    const signature = texts.slice(0,5).map(t => (t.textContent||'').replace(/\s+/g,' ').trim().slice(0,36)).join('|');
    return `offline-poster-text-styles-v2:${vb}:${texts.length}:${signature}`;
  };
  const readStyles = key => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; } };
  const saveStyles = svg => {
    const key = storageKey(svg), saved = readStyles(key);
    [...svg.querySelectorAll('text')].forEach((el, i) => {
      const style = {};
      TEXT_STYLE_ATTRS.forEach(attr => { if (el.hasAttribute(attr)) style[attr] = el.getAttribute(attr); });
      if (Object.keys(style).length) saved[keyForText(el, i)] = style;
    });
    try { localStorage.setItem(key, JSON.stringify(saved)); } catch {}
  };
  const restoreStyles = svg => {
    const saved = readStyles(storageKey(svg));
    [...svg.querySelectorAll('text')].forEach((el, i) => {
      const style = saved[keyForText(el, i)]; if (!style) return;
      Object.entries(style).forEach(([attr, value]) => el.setAttribute(attr, value));
      el.querySelectorAll('tspan').forEach(span => {
        ['font-size','font-weight','font-style','text-decoration'].forEach(attr => { if (style[attr] != null) span.setAttribute(attr, style[attr]); });
      });
    });
  };
  const configureTextPersistence = svg => {
    if (svg.dataset.psPersistBound) return;
    svg.dataset.psPersistBound = '1';
    restoreStyles(svg);
    const observer = new MutationObserver(records => {
      if (records.some(r => !r.target.closest?.('.__ps-text-selection'))) saveStyles(svg);
    });
    observer.observe(svg, {subtree:true, attributes:true, attributeFilter:TEXT_STYLE_ATTRS});
  };
  const setButton = (button, icon, label) => {
    if (!button || button.dataset.psLabel === label) return;
    button.dataset.psLabel = label;
    button.setAttribute('aria-label', label);
    button.innerHTML = `<span aria-hidden="true">${icon}</span><small>${label}</small>`;
  };
  const findField = text => [...document.querySelectorAll('.ps-label,label')].find(el => (el.textContent||'').toLowerCase().includes(text.toLowerCase()));
  const scrollToField = text => {
    const label = findField(text); const field = label?.closest('.ps-field') || label;
    if (field) { const form = document.querySelector('.ps-content-form'); if(form) { form.style.display='block'; document.querySelector('.ps-grid.ps-mode-edit')?.setAttribute('data-ps-show-form','1'); } field.scrollIntoView({behavior:'smooth',block:'center'}); }
  };
  const buildRail = nav => {
    if (!nav || nav.dataset.psComplete === '1') return;
    const existing = [...nav.querySelectorAll('button')];
    if (existing.length < 4) return;
    nav.dataset.psComplete = '1';
    const [textBtn, imageBtn, layoutBtn, themeBtn] = existing;
    setButton(textBtn, 'T', 'Text'); setButton(imageBtn, '▧', 'Image'); setButton(layoutBtn, '◇', 'Shape'); setButton(themeBtn, '•••', 'More');
    const edit = document.createElement('button');
    edit.type='button'; edit.className='ps-reference-edit-tool'; edit.innerHTML='<span aria-hidden="true">▣</span><small>Edit</small>'; edit.setAttribute('aria-label','Edit');
    edit.addEventListener('click', () => {
      const form=document.querySelector('.ps-content-form'); if(!form) return;
      const hidden=getComputedStyle(form).display==='none'; form.style.display=hidden?'block':'none';
      const grid=document.querySelector('.ps-grid.ps-mode-edit'); if(grid) { if(hidden) grid.setAttribute('data-ps-show-form','1'); else grid.removeAttribute('data-ps-show-form'); }
      if(hidden) form.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.insertBefore(edit, textBtn);
    const table = document.createElement('button');
    table.type='button'; table.className='ps-reference-table-tool'; table.innerHTML='<span aria-hidden="true">▦</span><small>Table</small>'; table.setAttribute('aria-label','Table');
    table.addEventListener('click', () => { scrollToField('KEY POINTS'); if(!document.querySelector('.ps-content-form')) scrollToField('MAIN TEXT'); });
    nav.insertBefore(table, layoutBtn);
    // Ensure tool order and labels remain stable after React replaces the rail.
    nav.dataset.psComplete='1';
  };
  const enhance = () => {
    document.querySelectorAll('.ps-edit-rail').forEach(buildRail);
    document.querySelectorAll('.ps-poster-editable svg').forEach(configureTextPersistence);
    document.querySelectorAll('.ps-poster-editable svg text').forEach(el => { el.style.pointerEvents='auto'; el.style.cursor='text'; });
  };
  const start = () => {
    enhance();
    const observer = new MutationObserver(() => enhance());
    observer.observe(document.documentElement, {childList:true,subtree:true});
    // Observe style changes made by the selection panel, then save selected text styling.
    document.addEventListener('click', ev => {
      if (ev.target.closest('.__ps-text-edit-controls')) setTimeout(() => { const svg=document.querySelector('.ps-poster-editable svg'); if(svg) saveStyles(svg); }, 0);
    }, true);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
})();
</script>
