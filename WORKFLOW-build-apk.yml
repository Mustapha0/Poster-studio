name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html is missing - upload the whole dist folder"; exit 1; }
          test -f package.json || { echo "ERROR: package.json is missing"; exit 1; }
          test -f capacitor.config.json || { echo "ERROR: capacitor.config.json is missing"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Allow saving exports to phone storage
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application android:requestLegacyExternalStorage="true"#' "$M"
          grep -n "STORAGE\|requestLegacy" "$M"

      - name: Apply app icon
        run: |
          RES=android/app/src/main/res
          if [ -f app-icons.zip ]; then
            unzip -oq app-icons.zip -d "$RES"
            echo "Icon applied from app-icons.zip"
          elif [ -d resources/android/res ]; then
            cp -r resources/android/res/. "$RES"/
            echo "Icon applied from resources folder"
          else
            echo "WARNING: no icon files uploaded (app-icons.zip) - building with the default icon"
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OfflinePosterStudio.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePosterStudio-apk
          path: OfflinePosterStudio.apk

      - name: Publish APK as a GitHub Release (direct download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Offline Poster Studio build ${{ github.run_number }}
          files: OfflinePosterStudio.apk
